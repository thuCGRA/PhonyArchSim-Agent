photodetector:
  ACADEMIA_Digital_PD:
    PDK: ""
    ref: "https://doi.org/10.1364/ofc.2018.m3f.1"
    type: Photodetector
    exp: True
    cfgs:
      length: 16 # um
      width: 20 # um
      static_power: 0.000025 # mW (25 nW @ -1 V)
      responsivity: 1.1 # A/W
      bandwidth: 27 # GHz
      sensitivity: -27 # dBm
  ACADEMIA_Analog_PD:
    PDK: ""
    ref: "https://doi.org/10.1364/ofc.2018.m3f.1"
    type: Photodetector
    exp: True
    cfgs:
      length: 180 # um
      width: 66 # um
      static_power: 0.000060 # mW (60 nW @ -1 V)
      responsivity: 1 # A/W
      bandwidth: 34 # GHz
      sensitivity: -27 # dBm
  LT_PD:
    PDK: ""
    ref: ""
    type: Photodetector
    exp: True
    cfgs:
      length: 4 # um
      width: 10 # um
      dynamic_power: 1.1 # mW
      responsivity: 1 # A/W
      bandwidth: 20 # GHz
      sensitivity: -25 # dBm
  Sandia_GeWG_PD: # Ultra compact 45 GHz CMOS compatible Germanium waveguide photodiode with low dark current (Optics Express 19, 2011, Sandia)
    PDK: ""
    platform: Ge-on-Si (SOI)
    ref: "https://doi.org/10.1364/OE.19.024897"
    type: Photodetector
    exp: True
    cfgs:
      length: 4 # um
      width: 1.3 # um
      responsivity: 0.8 # A/W
      bandwidth: 45 # GHz
      # sensitivity/power not reported
  NEC_APD: # 10 Gbit/s asymmetric waveguide APD with high sensitivity of -30 dBm (Electronics Letters 2006, NEC)
    PDK: ""
    platform: InP/InGaAs APD (NEC)
    ref: "https://doi.org/10.1049/el:20061700"
    type: Photodetector
    exp: True
    note: "length/width/responsivity 为折中构造（论文未报道器件几何与 responsivity）；responsivity 由 QE 94%@1550nm 换算；sensitivity -30.2dBm 为接收模块级"
    cfgs:
      length: 30 # um（折中构造：论文未报道）
      width: 10 # um（折中构造：论文未报道）
      responsivity: 1.17 # A/W（折中构造：QE 94% x 1.55/1.24）
      bandwidth: 20 # GHz
      sensitivity: -30.2 # dBm（接收模块级，APD+TIA，10 Gb/s BER）
