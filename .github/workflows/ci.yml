name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage

      # tests/run_tests.py discovers tests/ and (when langgraph is importable)
      # tests/deep/ automatically, so a single invocation covers the whole suite.
      - name: Run tests with coverage
        run: coverage run --source=photon_tuner tests/run_tests.py

      - name: Report coverage
        run: coverage report -m --skip-covered

  real-simulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make curl ca-certificates libgl1 libglib2.0-0t64
      - name: Bootstrap both environments
        run: bash scripts/env/bootstrap.sh
      - name: Evaluate one iteration with the real simulator
        run: |
          .venv-agent/bin/python main.py --provider mock --workload vit_tiny \
            --nn-model-factory tests.factory:build_vit_tiny --iterations 1 --output-root runs/ci-smoke
          .venv-agent/bin/python - <<'PY'
          import json
          import math
          from pathlib import Path
          run = Path("runs/ci-smoke/run_iteration_001")
          for step in ("iter_000", "iter_001"):
              metrics = json.loads((run / step / "metrics.json").read_text())
              assert math.isfinite(metrics["objective"]), (step, metrics["objective"])
          schedule = json.loads((run / "iter_001/analysis/schedule.json").read_text())
          assert schedule["mode"] == "serial", schedule
          PY
